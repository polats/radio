name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API Tests
        env:
          API_URL: https://api-production-9382.up.railway.app
        run: pnpm exec tsx apps/api/tests/api.test.ts

      - name: Run Schema Tests
        env:
          API_URL: https://api-production-9382.up.railway.app
        run: pnpm exec tsx apps/api/tests/schema.test.ts

      - name: Run Web Tests
        env:
          WEB_URL: https://web-production-4c0410.up.railway.app
        run: pnpm exec tsx apps/web/tests/pages.test.ts
